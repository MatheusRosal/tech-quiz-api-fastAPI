name: CI  # nome da pipeline no GitHub

on: # quando rodar
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs: # tarefas grandes da pipeline
  tests: # identificador do job
    name: Validar API  # nome visível do job
    runs-on: ubuntu-latest  # máquina temporária usada pelo GitHub

    steps:
      - name: Baixar código
        uses: actions/checkout@v4  # clona o repositório

      - name: Configurar Python
        uses: actions/setup-python@v5  # instala/configura Python
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar arquivo .env para testes
        run: |
          echo "APP_NAME=Tech Quiz API" >> .env
          echo "APP_VERSION=0.1.0" >> .env
          echo "ENVIRONMENT=test" >> .env
          echo "OPENAI_API_KEY=fake-key-for-tests" >> .env
          echo "OPENAI_MODEL=gpt-5.6-luna" >> .env

      - name: Rodar testes
        run: pytest -v

      - name: Buildar imagem Docker
        run: docker build -t tech-quiz-api .

      - name: Subir container
        run: docker compose -f docker-compose.yml up --build -d

      - name: Healthcheck da API
        run: |
          sleep 5
          curl -f http://localhost:8000/health

      - name: Mostrar logs do container
        if: always()
        run: docker compose -f docker-compose.yml logs

      - name: Derrubar container
        if: always()
        run: docker compose -f docker-compose.yml down
